<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모급">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>모급</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Pretendard','Noto Sans KR',system-ui,sans-serif;background:#fff;color:#1f2a44;min-height:100vh;position:relative;overflow-x:hidden}
.arch{position:absolute;top:0;left:50%;width:170%;height:300px;transform:translateX(-50%);border-radius:0 0 50% 50%;background:linear-gradient(#FFEEDC,#FFF8F0 75%,#fff);z-index:0}
main{position:relative;z-index:1;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
header{text-align:center}
.logo{width:92px;height:92px;filter:drop-shadow(0 8px 14px rgba(234,88,12,.25))}
.brand{font-size:30px;font-weight:900;color:#EA580C;letter-spacing:-1px;margin-top:4px}
.sub{margin:2px 0 20px;color:#7c5a43;font-size:14px}
.pill{display:flex;align-items:center;background:#fff;border:1.5px solid #e6d3c3;border-radius:999px;padding:4px 6px 4px 20px;box-shadow:0 8px 24px rgba(234,88,12,.08)}
.pill input{flex:1;border:0;outline:0;font-size:16px;background:none;padding:12px 0;color:#1f2a44;min-width:0}
.pill input::placeholder{color:#c4b5a8}
.go{border:0;background:none;padding:10px 12px}
.s{background:#fff;border:1px solid #f3e3d5;border-radius:18px;padding:14px 18px;margin-top:10px;box-shadow:0 4px 14px rgba(31,42,68,.05)}
.s b{font-size:16px}.s small{display:block;color:#8b8b9a;margin-top:3px}
.msg{text-align:center;color:#8b8b9a;margin-top:18px}.err{color:#c2410c}
.badge{display:table;margin:6px auto 12px;background:#FFEDD5;color:#C2410C;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px}
h1{text-align:center;font-size:27px;font-weight:900;margin:0 0 16px;letter-spacing:-.5px}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px}
.nav button{width:46px;height:46px;border-radius:50%;border:1.5px solid #e6d3c3;background:#fff;font-size:22px;color:#EA580C}
.nav input{flex:1;max-width:220px;height:46px;border:1.5px solid #e6d3c3;border-radius:999px;text-align:center;font-size:16px;background:#fff;color:#1f2a44}
.card{background:#fff;border:1px solid #fbe6d4;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 10px 28px rgba(234,88,12,.09)}
.mt{display:inline-block;background:#E0E7FF;color:#3B4BA0;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:10px}
ul{margin:0;padding:0;list-style:none}li{padding:7px 0;border-bottom:1px dashed #f3e3d5;font-size:16px}li:last-child{border:0}
li:before{content:"";display:inline-block;width:7px;height:7px;background:#FB923C;border-radius:50%;margin-right:10px}
.cal{margin-top:10px;color:#8b8b9a;font-size:13px}
.ghost{display:block;margin:24px auto 0;background:none;border:1.5px solid #e6d3c3;color:#7c5a43;padding:12px 22px;border-radius:999px;font-size:14px}
.tip{text-align:center;color:#a8a29e;font-size:12px;margin-top:16px}
</style></head><body>
<div class="arch"></div>
<main>
<header><img class="logo" src="logo.png"><div class="brand">모급</div><p class="sub">모든 학교 급식을 쉽게!</p></header>
<section id="search">
  <div class="pill"><input id="q" placeholder="우리 학교 이름을 검색해주세요" onkeydown="if(event.key==='Enter')find()">
  <button class="go" onclick="find()" aria-label="검색"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2a44" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
  <div id="list"></div>
</section>
<section id="meal" style="display:none">
  <div class="badge" id="sname"></div>
  <h1>더욱 편리한 급식 확인</h1>
  <div class="nav"><button onclick="mv(-1)">‹</button><input id="d" type="date" onchange="load()"><button onclick="mv(1)">›</button></div>
  <div id="out"></div>
  <button class="ghost" onclick="reset()">학교 다시 선택</button>
  <p class="tip">홈 화면에 추가하면 앱처럼 바로 열 수 있어요</p>
</section>
</main>
<script src="config.js"></script>
<script src="shim.js"></script>
<script>
const B="https://open.neis.go.kr/hub/",$=id=>document.getElementById(id);
function api(path,p){
  p.KEY=NEIS_KEY;p.Type="json";
  const u=B+path+"?"+new URLSearchParams(p);
  return Promise.resolve(Android.get(u)).then(t=>JSON.parse(t)).catch(()=>({error:"parse"}));
}
function rowsOf(j,k){return j&&j[k]&&j[k][1]?j[k][1].row:null}
function cur(){const a=Android.load();if(!a)return null;const [o,c,n]=a.split("|");return{o,c,n}}
async function find(){
  const n=$("q").value.trim();if(!n)return;
  $("list").innerHTML='<p class="msg">검색 중...</p>';
  const j=await api("schoolInfo",{pIndex:1,pSize:20,SCHUL_NM:n});
  if(j.error){$("list").innerHTML='<p class="msg err">인터넷 연결을 확인하세요. ('+j.error+')</p>';return}
  const r=rowsOf(j,"schoolInfo");
  if(!r){$("list").innerHTML='<p class="msg">검색 결과가 없습니다.</p>';return}
  $("list").innerHTML="";
  r.forEach(s=>{
    const d=document.createElement("div");d.className="s";
    d.innerHTML="<b>"+s.SCHUL_NM+"</b><small>"+(s.ORG_RDNMA||"")+"</small>";
    d.onclick=()=>{Android.save(s.ATPT_OFCDC_SC_CODE,s.SD_SCHUL_CODE,s.SCHUL_NM,NEIS_KEY);start()};
    $("list").appendChild(d);
  });
}
function reset(){Android.clear();$("list").innerHTML="";start()}
function mv(n){const t=new Date($("d").value);t.setDate(t.getDate()+n);$("d").value=t.toISOString().slice(0,10);load()}
async function load(){
  const s=cur();if(!s)return;
  $("out").innerHTML='<p class="msg">불러오는 중...</p>';
  const j=await api("mealServiceDietInfo",{ATPT_OFCDC_SC_CODE:s.o,SD_SCHUL_CODE:s.c,MLSV_YMD:$("d").value.replace(/-/g,"")});
  if(j.error){$("out").innerHTML='<p class="msg err">인터넷 연결을 확인하세요. ('+j.error+')</p>';return}
  const r=rowsOf(j,"mealServiceDietInfo");
  if(!r){$("out").innerHTML='<div class="card msg">이 날짜의 급식 정보가 없습니다.</div>';return}
  $("out").innerHTML=r.map(x=>'<div class="card"><span class="mt">'+x.MMEAL_SC_NM+'</span><ul>'+
    x.DDISH_NM.split(/<br\/>/).map(m=>'<li>'+m.replace(/\s*\([0-9.]+\)/g,"")+'</li>').join("")+
    '</ul><div class="cal">'+(x.CAL_INFO||"")+'</div></div>').join("");
}
function start(){
  const s=cur();
  if(s){
    Android.save(s.o,s.c,s.n,NEIS_KEY);
    $("sname").textContent=s.n;$("search").style.display="none";$("meal").style.display="block";
    if(!$("d").value)$("d").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    load();
  }else{$("search").style.display="block";$("meal").style.display="none"}
}
start();
</script></body></html>
